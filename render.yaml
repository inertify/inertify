# Render Blueprint for the Inertify landing site.
#
# `name` must match the existing service in the Render dashboard exactly. Render
# applies a Blueprint to a service of the same name, and creates a brand new one
# (with a new onrender.com hostname) if the name does not match.
services:
  - name: inertify
    type: web
    runtime: static
    buildCommand: npm install && npm run generate
    # Relative to rootDir, which defaults to the repo root.
    staticPublishPath: ./.output/public

    routes:
      # The Form documentation used to be a separate service proxied under
      # /form, so that bare URL was public. Nothing is published there now: the
      # documentation pages are part of this site and start one level deeper.
      # Nuxt turns the same rule into a `<meta http-equiv="refresh">` stub for
      # dev and preview (see routeRules in nuxt.config.ts); this answers with a
      # real redirect, and covers /form/ too — Render matches it as the same
      # path, while the generated stub only sits at /form.
      - type: redirect
        source: /form
        destination: /form/getting-started/installation

    headers:
      # Render serves every static asset with `max-age=0` by default, so
      # browsers cache nothing: fonts are re-fetched on each visit (text paints
      # in the fallback, then reflows) and prefetched route chunks have to be
      # revalidated before they can be used. These filenames are content-hashed,
      # so they can be cached indefinitely.
      - path: /_nuxt/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /_fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # Unlike the two above, /_ipx URLs are not content-hashed — the path stays
      # the same when the source image changes — so they must stay revalidatable.
      - path: /_ipx/*
        name: Cache-Control
        value: public, max-age=86400

      # A client-side navigation blocks on the target route's payload, which
      # Nuxt prefetches through its `link:prefetch` hook. Uncached, the prefetch
      # is wasted and the navigation refetches it. Requests carry a
      # `?_b=<build-id>` query, so a deploy busts these — but not `immutable`,
      # in case anything ever asks for one without the query.
      - path: /_payload.json
        name: Cache-Control
        value: public, max-age=3600
      - path: /**/_payload.json
        name: Cache-Control
        value: public, max-age=3600

      # The client-side content database that backs search. Its URL carries no
      # hash or build id at all, so this stays short: a long cache would leave a
      # stale content DB behind freshly deployed HTML.
      - path: /__nuxt_content/*
        name: Cache-Control
        value: public, max-age=300

    # Set so sitemap, canonical, Open Graph, and llms.txt URLs use the custom
    # domain. This overwrites whatever is configured in the dashboard.
    envVars:
      - key: NUXT_SITE_URL
        value: https://inertify.dev
